<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">Noah Fage</a>
    <nav>
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/projects/' | relative_url }}">projects</a>
      <a href="{{ '/writing/' | relative_url }}">writing</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <a href="https://www.linkedin.com/in/{{ site.linkedin }}">linkedin</a>
    <a href="{{ '/feed.xml' | relative_url }}">rss</a>
  </footer>
</body>
</html>
