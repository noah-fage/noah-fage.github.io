<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  {% assign ctf_posts = site.tags.ctf %}
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">Noah Fage</a>
    <nav aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="current"{% endif %}>home</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} class="current"{% endif %}>projects</a>
      {% if ctf_posts.size > 0 %}<a href="{{ '/ctf/' | relative_url }}"{% if page.url == '/ctf/' %} class="current"{% endif %}>ctf</a>{% endif %}
      <a href="{{ '/writing/' | relative_url }}"{% if page.url == '/writing/' %} class="current"{% endif %}>writing</a>
      <a href="{{ '/links/' | relative_url }}"{% if page.url == '/links/' %} class="current"{% endif %}>links</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="current"{% endif %}>about</a>
      <a href="{{ '/assets/Noah_Fage_Resume.pdf' | relative_url }}">resume</a>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer>
    <a href="https://github.com/{{ site.github }}">github</a>
    <a href="https://www.linkedin.com/in/{{ site.linkedin }}">linkedin</a>
    <a href="mailto:{{ site.email }}">email</a>
    <a href="{{ '/feed.xml' | relative_url }}">rss</a>
  </footer>
</body>
</html>
