<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">Noah Fage</a>
    <nav>
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/projects/' | relative_url }}">projects</a>
      <a href="{{ '/writing/' | relative_url }}">writing</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <a href="https://www.linkedin.com/in/{{ site.linkedin }}">linkedin</a>
  </footer>
</body>
</html>
